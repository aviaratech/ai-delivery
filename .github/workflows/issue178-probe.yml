name: Issue178 temporary Windows feasibility

on:
  pull_request:
    paths:
      - .github/workflows/issue178-probe.yml
      - fixtures/issue178-probe/**

permissions:
  contents: read

env:
  PROBE_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      input_digest: ${{ steps.stage.outputs.input_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Stage exact reviewed fixtures
        id: stage
        env:
          PROBE_STAGE: ${{ runner.temp }}/issue178-input
        run: |
          node --check fixtures/issue178-probe/probe.mjs
          node fixtures/issue178-probe/probe.mjs stage "$PROBE_STAGE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue178-input-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue178-input
          if-no-files-found: error
          retention-days: 7

  native-windows:
    needs: stage
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      PROBE_INPUT_DIGEST: ${{ needs.stage.outputs.input_digest }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: issue178-input-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue178-input
      - name: Native stock PowerShell experiment without a checkout
        shell: powershell
        env:
          PROBE_INPUT: ${{ runner.temp }}/issue178-input
          PROBE_RESULTS: ${{ runner.temp }}/issue178-results
        run: node "$env:PROBE_INPUT/probe.mjs" run "$env:PROBE_RESULTS"
      - name: Retain partial or final native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue178-native-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue178-results
          if-no-files-found: warn
          retention-days: 7
