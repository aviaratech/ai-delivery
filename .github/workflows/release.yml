name: Publish npm package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    if: github.ref == 'refs/heads/main' && github.ref_protected && github.repository == 'aviaratech/ai-delivery'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global npm@11.19.0
      - name: Check release metadata
        run: |
          node --input-type=module -e "import pkg from './package.json' with { type: 'json' }; if (pkg.private !== false || pkg.license !== 'MIT' || pkg.repository?.url !== 'git+https://github.com/aviaratech/ai-delivery.git') process.exit(1)"
      - name: Verify and pack
        run: |
          npm ci
          npm run checks
          npm run build
          mkdir -p package-artifact
          npm pack --pack-destination package-artifact
          cd package-artifact
          shasum -a 256 ./*.tgz > SHA256SUMS
      - name: Scan source history
        uses: trufflesecurity/trufflehog@f714bf454f350590f4a24c3ddb1aef02c35bf5b6 # v3.97.5
        with:
          version: '3.97.5'
          extra_args: --no-verification
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: package-artifact/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Pin npm
        run: npm install --global npm@11.19.0
      - name: Download verified package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: npm-package
          path: package-artifact
      - name: Publish with npm trusted publishing
        run: |
          test "$(find package-artifact -maxdepth 1 -name '*.tgz' -type f | wc -l | tr -d ' ')" = 1
          cd package-artifact
          shasum -a 256 -c SHA256SUMS
          npm publish ./*.tgz --access public
