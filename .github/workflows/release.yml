name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      reviewed_source_sha:
        description: Independently accepted protected main commit (40 lowercase hex characters)
        required: true
        type: string
      package_version:
        description: Independently accepted stable package version
        required: true
        type: string
      archive_sha256:
        description: Independently accepted npm archive SHA256 (64 lowercase hex characters)
        required: true
        type: string

concurrency:
  group: npm-publish
  cancel-in-progress: false

env:
  REVIEWED_SOURCE_SHA: ${{ inputs.reviewed_source_sha }}
  RELEASE_VERSION: ${{ inputs.package_version }}
  REVIEWED_ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}

permissions:
  contents: read

jobs:
  package:
    if: github.ref == 'refs/heads/main' && github.ref_protected && github.repository == 'aviaratech/ai-delivery'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.2.0
          package-manager-cache: false
      - name: Retain public-library consumer executable
        run: echo "AI_DELIVERY_NODE26_EXECUTABLE=$(node -p 'process.execPath')" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global npm@11.19.0
      - name: Check reviewed source and release metadata
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import pkg from './package.json' with { type: 'json' };
          const { REVIEWED_SOURCE_SHA: source, RELEASE_VERSION: version, REVIEWED_ARCHIVE_SHA256: digest } = process.env;
          if (!/^[a-f0-9]{40}$/.test(source ?? '') || !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version ?? '') || !/^[a-f0-9]{64}$/.test(digest ?? '')) throw new Error('Missing or invalid reviewed release inputs.');
          if (process.env.GITHUB_SHA !== source || execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim() !== source) throw new Error('Dispatch or checkout differs from the reviewed source.');
          if (pkg.name !== '@aviaratech/ai-delivery' || pkg.version !== version || pkg.private !== false || pkg.license !== 'MIT' || pkg.repository?.url !== 'git+https://github.com/aviaratech/ai-delivery.git') throw new Error('Reviewed release metadata differs from the source package.');
          JS
      - name: Verify and pack
        run: |
          npm ci
          npm run checks
          npm run build
          mkdir -p package-artifact
          npm pack --pack-destination package-artifact
          cd package-artifact
          test "$(find . -maxdepth 1 -name '*.tgz' -type f | wc -l | tr -d ' ')" = 1
          printf '%s  %s\n' "$REVIEWED_ARCHIVE_SHA256" "aviaratech-ai-delivery-$RELEASE_VERSION.tgz" | shasum -a 256 -c -
          shasum -a 256 ./*.tgz > SHA256SUMS
      - name: Scan source history
        uses: trufflesecurity/trufflehog@f714bf454f350590f4a24c3ddb1aef02c35bf5b6 # v3.97.5
        with:
          version: '3.97.5'
          extra_args: --no-verification
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: package-artifact/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: package
    if: github.ref == 'refs/heads/main' && github.ref_protected && github.repository == 'aviaratech/ai-delivery'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Pin npm
        run: npm install --global npm@11.19.0
      - name: Download verified package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: npm-package
          path: package-artifact
      - name: Publish with npm trusted publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(find package-artifact -maxdepth 1 -name '*.tgz' -type f | wc -l | tr -d ' ')" = 1
          cd package-artifact
          printf '%s  %s\n' "$REVIEWED_ARCHIVE_SHA256" "aviaratech-ai-delivery-$RELEASE_VERSION.tgz" | shasum -a 256 -c -
          shasum -a 256 -c SHA256SUMS
          mkdir unpacked repacked
          tar -xzf ./*.tgz -C unpacked
          cd unpacked/package
          npm pack --ignore-scripts --pack-destination ../../repacked
          test "$(find ../../repacked -maxdepth 1 -name '*.tgz' -type f | wc -l | tr -d ' ')" = 1
          cmp ../../*.tgz ../../repacked/*.tgz
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          import pkg from './package.json' with { type: 'json' };
          const { REVIEWED_SOURCE_SHA: source, RELEASE_VERSION: version, REVIEWED_ARCHIVE_SHA256: digest } = process.env;
          const archive = readFileSync(`../../aviaratech-ai-delivery-${version}.tgz`);
          const sha256 = bytes => createHash('sha256').update(bytes).digest('hex');
          const integrity = `sha512-${createHash('sha512').update(archive).digest('base64')}`;
          if (process.env.GITHUB_SHA !== source || sha256(archive) !== digest || pkg.name !== '@aviaratech/ai-delivery' || pkg.version !== version || pkg.private !== false || pkg.license !== 'MIT' || pkg.repository?.url !== 'git+https://github.com/aviaratech/ai-delivery.git') throw new Error('Downloaded package differs from the reviewed release.');
          let reconciliationDeadline;
          const unresolved = () => new Error('Registry reconciliation unresolved within its external-job allowance; qualify the original publication read-only. Publication will not be repeated.');
          const request = async (url, options = {}) => {
            const remaining = reconciliationDeadline === undefined ? 30_000 : Math.min(30_000, Math.ceil(reconciliationDeadline - performance.now()));
            if (remaining <= 0) throw unresolved();
            try {
              return await fetch(url, { ...options, redirect: 'error', signal: AbortSignal.timeout(remaining) });
            } catch (error) {
              if (reconciliationDeadline !== undefined && performance.now() >= reconciliationDeadline) throw unresolved();
              throw error;
            }
          };
          const readBody = async (response, limit) => {
            const parts = [];
            let size = 0;
            try {
              for await (const part of response.body) {
                size += part.length;
                if (size > limit) throw new Error('Registry response exceeds the reviewed readback bound.');
                parts.push(part);
              }
            } catch (error) {
              if (reconciliationDeadline !== undefined && performance.now() >= reconciliationDeadline && ['AbortError', 'TimeoutError'].includes(error.name)) throw unresolved();
              throw error;
            }
            return Buffer.concat(parts);
          };
          const readJson = async response => JSON.parse((await readBody(response, 4 * 1024 * 1024)).toString('utf8'));
          const requireMain = async () => {
            const response = await request('https://api.github.com/repos/aviaratech/ai-delivery/branches/main', { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' } });
            if (!response.ok) throw new Error(`Main readback failed: ${response.status}`);
            const branch = await readJson(response);
            const checks = branch.protection?.required_status_checks;
            if (branch.name !== 'main' || branch.protected !== true || branch.commit?.sha !== source || checks?.enforcement_level !== 'everyone' || !['checks', 'secrets'].every(name => checks.contexts?.includes(name))) throw new Error('Protected main or its required checks drifted from the reviewed release.');
          };
          const registry = 'https://registry.npmjs.org';
          const packageUrl = `${registry}/@aviaratech%2fai-delivery`;
          const readPackage = async () => {
            const response = await request(packageUrl);
            if (!response.ok) throw new Error(`Package registry readback failed: ${response.status}`);
            return readJson(response);
          };
          const readVersion = () => request(`${packageUrl}/${version}`);
          const compareLatest = latest => {
            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(latest ?? '')) throw new Error('Missing or non-stable latest registry version.');
            const next = version.split('.').map(BigInt), prior = latest.split('.').map(BigInt);
            const difference = next.findIndex((part, index) => part !== prior[index]);
            return difference < 0 ? 0 : next[difference] > prior[difference] ? 1 : -1;
          };
          const inspectManifest = published => {
            if (published.name !== pkg.name || published.version !== version || published.dist?.integrity !== integrity) throw new Error('Registry version or integrity differs from the reviewed release.');
            const predicate = published.dist?.attestations?.provenance?.predicateType;
            if (predicate !== undefined && predicate !== 'https://slsa.dev/provenance/v1') throw new Error('Registry provenance evidence differs from the reviewed release.');
            const tarball = new URL(published.dist.tarball);
            if (tarball.origin !== registry || tarball.username || tarball.password) throw new Error('Unexpected registry tarball origin.');
            return { tarball, hasProvenance: predicate !== undefined };
          };
          const verifyPublished = async (initialResponse, initialPackage) => {
            // Five minutes of GET-only reconciliation fit inside the existing ten-minute publish job.
            reconciliationDeadline = performance.now() + 5 * 60_000;
            for (let attempt = 1; ; attempt++) {
              const pending = [];
              const index = initialPackage ?? await readPackage();
              initialPackage = undefined;
              const latestComparison = compareLatest(index['dist-tags']?.latest);
              if (latestComparison < 0) throw new Error('Registry latest tag advanced beyond the reviewed release; refusing to retag.');
              if (latestComparison > 0) pending.push('latest tag');
              const indexed = index.versions?.[version];
              const indexedManifest = indexed === undefined ? undefined : inspectManifest(indexed);
              if (!indexedManifest) pending.push('package index');
              else if (!indexedManifest.hasProvenance) pending.push('index provenance');
              const response = initialResponse ?? await readVersion();
              initialResponse = undefined;
              if (response.status === 404) pending.push('version visibility');
              else {
                if (!response.ok) throw new Error(`Version registry readback failed: ${response.status}; no publication retry permitted.`);
                const published = inspectManifest(await readJson(response));
                if (!published.hasProvenance) pending.push('version provenance');
                if (indexedManifest && published.tarball.href !== indexedManifest.tarball.href) throw new Error('Registry index tarball differs from the version readback.');
                const bytes = await request(published.tarball);
                if (bytes.status === 404) pending.push('archive visibility');
                else {
                  if (!bytes.ok) throw new Error(`Archive registry readback failed: ${bytes.status}; no publication retry permitted.`);
                  if (sha256(await readBody(bytes, archive.length)) !== digest) throw new Error('Registry archive differs from the reviewed bytes.');
                }
              }
              if (performance.now() >= reconciliationDeadline) throw unresolved();
              if (pending.length === 0) {
                console.log('Exact reviewed registry version, archive, integrity, provenance metadata, package index and latest reconciled.');
                return;
              }
              console.log(JSON.stringify({ registryReconciliation: 'pending', attempt, waitingFor: pending, remainingMs: Math.floor(reconciliationDeadline - performance.now()) }));
              await new Promise(resolve => setTimeout(resolve, Math.min(15_000, reconciliationDeadline - performance.now())));
            }
          };
          await requireMain();
          const response = await readVersion();
          if (response.status === 404) {
            const index = await readPackage();
            const latestComparison = compareLatest(index['dist-tags']?.latest);
            if (latestComparison < 0) throw new Error('Release would not advance latest; refusing to publish.');
            if (latestComparison === 0 || index.versions?.[version] !== undefined) {
              await verifyPublished(response, index);
              console.log('The exact reviewed release is already published with latest and provenance evidence; no publication repeated.');
            } else {
              await requireMain();
              const result = spawnSync('npm', ['publish', '.', '--ignore-scripts', '--access', 'public', '--tag', 'latest', '--registry', registry, '--provenance'], { stdio: 'inherit' });
              console.log(JSON.stringify({ publicationInvokedOnce: true, status: result.status, signal: result.signal ?? null, error: result.error?.message ?? null }));
              await verifyPublished();
              if (result.status !== 0) throw new Error('npm publish failed or was ambiguous; matching registry readback was recorded. Qualify the original invocation; no automatic publication retry.');
            }
          } else {
            await verifyPublished(response);
            console.log('The exact reviewed release is already published with latest and provenance evidence; no publication repeated.');
          }
          JS
