name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      reviewed_source_sha:
        description: Independently accepted protected main commit (40 lowercase hex characters)
        required: true
        type: string
      package_version:
        description: Independently accepted stable package version
        required: true
        type: string
      qualification_only:
        description: Qualify reviewed source without publication or promotion inputs
        required: false
        default: false
        type: boolean
      archive_sha256:
        description: Independently accepted npm archive SHA256 (required for publication)
        required: false
        type: string
      qualification_artifact_id:
        description: Independently accepted immutable qualification artifact ID (required for publication)
        required: false
        type: string

concurrency:
  group: npm-publish
  cancel-in-progress: false

env:
  REVIEWED_SOURCE_SHA: ${{ inputs.reviewed_source_sha }}
  RELEASE_VERSION: ${{ inputs.package_version }}
  REVIEWED_ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
  QUALIFICATION_ONLY: ${{ inputs.qualification_only }}
  QUALIFICATION_ARTIFACT_ID: ${{ inputs.qualification_artifact_id }}

permissions:
  contents: read

jobs:
  package:
    if: github.ref == 'refs/heads/main' && github.ref_protected && github.repository == 'aviaratech/ai-delivery'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      qualification_artifact_id: ${{ steps.qualified.outputs.artifact-id }}
      archive_sha256: ${{ steps.qualification.outputs.archive_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Check reviewed source and release metadata
        id: origin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          import pkg from './package.json' with { type: 'json' };
          import { releaseDispatch, validateQualificationOrigin } from './scripts/release-artifact.mjs';
          const dispatch = releaseDispatch({ source: process.env.REVIEWED_SOURCE_SHA, version: process.env.RELEASE_VERSION, digest: process.env.REVIEWED_ARCHIVE_SHA256, qualificationOnly: process.env.QUALIFICATION_ONLY, artifactId: process.env.QUALIFICATION_ARTIFACT_ID });
          const { source, version } = dispatch;
          if (process.env.GITHUB_SHA !== source || execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim() !== source) throw new Error('Dispatch or checkout differs from the reviewed source.');
          if (pkg.name !== '@aviaratech/ai-delivery' || pkg.version !== version || pkg.private !== false || pkg.license !== 'MIT' || pkg.repository?.url !== 'git+https://github.com/aviaratech/ai-delivery.git') throw new Error('Reviewed release metadata differs from the source package.');
          const read = async path => {
            const response = await fetch(`https://api.github.com/repos/aviaratech/ai-delivery/${path}`, { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' }, redirect: 'error', signal: AbortSignal.timeout(30_000) });
            if (!response.ok) throw new Error(`Native release readback failed: ${response.status}`);
            const parts = []; let size = 0;
            for await (const part of response.body) {
              size += part.length;
              if (size > 4 * 1024 * 1024) throw new Error('Native release metadata exceeds its bound.');
              parts.push(part);
            }
            return JSON.parse(Buffer.concat(parts).toString('utf8'));
          };
          const branch = await read('branches/main');
          const checks = branch.protection?.required_status_checks;
          if (branch.name !== 'main' || branch.protected !== true || branch.commit?.sha !== source || checks?.enforcement_level !== 'everyone' || !['checks', 'secrets'].every(name => checks.contexts?.includes(name))) throw new Error('Protected main or its required checks drifted from the reviewed release.');
          if (!dispatch.qualificationOnly) {
            const artifact = await read(`actions/artifacts/${dispatch.artifactId}`);
            const runId = artifact.workflow_run?.id;
            const match = /^npm-qualified-([1-9]\d*)$/.exec(artifact.name ?? '');
            const attemptNumber = Number(match?.[1]);
            if (!Number.isSafeInteger(runId) || runId < 1 || !Number.isSafeInteger(attemptNumber) || attemptNumber < 1) throw new Error('Original qualification identity is missing or unsafe.');
            const [attempt, workflow, jobs] = await Promise.all([read(`actions/runs/${runId}/attempts/${attemptNumber}`), read('actions/workflows/release.yml'), read(`actions/runs/${runId}/attempts/${attemptNumber}/jobs?per_page=100`)]);
            const origin = validateQualificationOrigin({ artifact, attempt, workflow, jobs }, { repository: process.env.GITHUB_REPOSITORY, repositoryId: Number(process.env.GITHUB_REPOSITORY_ID), source, artifactId: dispatch.artifactId });
            appendFileSync(process.env.GITHUB_OUTPUT, `run_id=${origin.runId}\nrun_attempt=${origin.runAttempt}\nartifact_id=${origin.artifactId}\n`);
          }
          JS
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ inputs.qualification_only }}
        with:
          node-version: 26.2.0
          package-manager-cache: false
      - name: Retain public-library consumer executable
        if: ${{ inputs.qualification_only }}
        run: echo "AI_DELIVERY_NODE26_EXECUTABLE=$(node -p 'process.execPath')" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ inputs.qualification_only }}
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Pin npm
        if: ${{ inputs.qualification_only }}
        run: npm install --global npm@11.19.0
      - name: Qualify and retain the exact archive
        id: qualification
        if: ${{ inputs.qualification_only }}
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run checks:release -- --results-dir "$RUNNER_TEMP/release-qualification"
          node scripts/release-artifact.mjs select "$RUNNER_TEMP/release-qualification" "$RUNNER_TEMP/release-artifact"
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const proof = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/release-artifact/qualification.json`, 'utf8'));
          appendFileSync(process.env.GITHUB_OUTPUT, `archive_sha256=${proof.archive.sha256}\n`);
          JS
          cd "$RUNNER_TEMP/release-artifact"
          test "$(find . -maxdepth 1 -name '*.tgz' -type f | wc -l | tr -d ' ')" = 1
          shasum -a 256 ./*.tgz > SHA256SUMS
      - name: Prepare failed qualification diagnostics
        id: diagnostics
        if: ${{ always() && inputs.qualification_only && steps.origin.outcome == 'success' && (steps.qualification.outcome == 'failure' || steps.qualification.outcome == 'cancelled') }}
        env:
          QUALIFICATION_OUTCOME: ${{ steps.qualification.outcome }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, constants, closeSync, fstatSync, lstatSync, mkdtempSync, openSync, readSync, realpathSync, rmSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { basename, dirname, join, resolve } from 'node:path';
          import { fileURLToPath } from 'node:url';
          import { RELEASE_CASES } from './scripts/checks.mjs';
          const env = process.env;
          const temporary = realpathSync(env.RUNNER_TEMP);
          const root = join(temporary, 'release-qualification');
          const inputs = {};
          // No original bytes or free-form strings cross this observation boundary.
          const read = (label, parts) => {
            if (!parts) { inputs[label] = 'unavailable'; return null; }
            let fd;
            try {
              let path = root;
              for (const part of ['', ...parts.slice(0, -1)]) {
                if (part) path = join(path, part);
                const stat = lstatSync(path);
                if (!stat.isDirectory() || stat.isSymbolicLink() || realpathSync(path) !== path) throw 0;
              }
              path = join(root, ...parts);
              const stat = lstatSync(path);
              if (!stat.isFile() || stat.isSymbolicLink() || realpathSync(path) !== path) throw 0;
              if (stat.size > 4 * 1024 * 1024) { inputs[label] = 'oversized'; return null; }
              fd = openSync(path, constants.O_RDONLY | constants.O_NOFOLLOW);
              const opened = fstatSync(fd);
              if (opened.dev !== stat.dev || opened.ino !== stat.ino || opened.size !== stat.size) throw 0;
              const buffer = Buffer.alloc(stat.size + 1);
              const length = readSync(fd, buffer, 0, buffer.length, 0);
              if (length !== stat.size || fstatSync(fd).size !== stat.size || realpathSync(path) !== path) throw 0;
              let value;
              try { value = JSON.parse(buffer.subarray(0, length).toString('utf8')); }
              catch { inputs[label] = 'invalid'; return null; }
              if (!value || typeof value !== 'object' || Array.isArray(value)) { inputs[label] = 'invalid'; return null; }
              inputs[label] = 'read'; return value;
            } catch (error) { inputs[label] = error?.code === 'ENOENT' ? 'missing' : 'unsafe'; return null; }
            finally { if (fd !== undefined) closeSync(fd); }
          };
          const choice = (value, allowed) => allowed.includes(value) ? value : 'unknown';
          const status = value => choice(value, ['starting', 'running', 'completed', 'reconciled', 'passed', 'failed', 'cancelled', 'incomplete']);
          const number = (value, min = 0, max = Number.MAX_SAFE_INTEGER) => Number.isSafeInteger(value) && value >= min && value <= max ? value : null;
          const boolean = value => typeof value === 'boolean' ? value : null;
          const command = value => ({ status: status(value?.status), exitCode: number(value?.exitCode, -255, 255), signal: value?.signal === null ? null : choice(value?.signal, ['SIGINT', 'SIGTERM', 'SIGKILL']), cleanupConfirmed: boolean(value?.cleanupConfirmed), outputBytes: number(value?.outputBytes), peakRssBytes: number(value?.peakRssBytes) });
          const cleanup = value => ({ removed: boolean(value?.removed), quiescent: boolean(value?.quiescent) });
          const overall = read('overall', ['result.json']);
          const producer = read('producer', ['producer', 'result.json']);
          const releaseAttempt = read('releaseAttempt', ['release-tests-attempt.json']);
          const consumerAttempt = read('consumerAttempt', ['consumer-attempt.json']);
          const current = (attempt, prefix, receipt) => {
            const directory = attempt?.directory;
            const name = typeof directory === 'string' ? basename(directory) : '';
            const uuid = '[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}';
            return overall?.schemaVersion === 'ai-delivery.current-qualification@1' && typeof overall.runId === 'string' && new RegExp(`^${uuid}$`).test(overall.runId) && attempt?.runId === overall.runId && new RegExp(`^${prefix}-${uuid}$`).test(name) && directory === join(root, name) && attempt[receipt] === join(directory, 'result.json') ? name : null;
          };
          const releaseDirectory = current(releaseAttempt, 'release-tests', 'resultPath');
          const consumerDirectory = current(consumerAttempt, 'consumer', 'consumerPath');
          const release = read('release', releaseDirectory && [releaseDirectory, 'result.json']);
          const vitest = read('vitest', releaseDirectory && [releaseDirectory, 'vitest.json']);
          const consumer = read('consumer', consumerDirectory && [consumerDirectory, 'result.json']);
          const workspace = realpathSync(env.GITHUB_WORKSPACE);
          const publicFiles = ['setup', 'lifecycle', 'targetPolicyLocal', 'pluginPackaging'].flatMap(name => [`src/${name}.test.ts`, `dist/${name}.test.js`]);
          const codeBounds = new Map();
          const bounds = file => {
            if (codeBounds.has(file)) return codeBounds.get(file);
            codeBounds.set(file, null);
            let fd;
            try {
              const path = join(workspace, file);
              const stat = lstatSync(path);
              if (!stat.isFile() || stat.isSymbolicLink() || stat.nlink !== 1 || stat.size > 4 * 1024 * 1024 || realpathSync(path) !== path) return null;
              fd = openSync(path, constants.O_RDONLY | constants.O_NOFOLLOW);
              const opened = fstatSync(fd);
              if (opened.dev !== stat.dev || opened.ino !== stat.ino || opened.size !== stat.size) return null;
              const buffer = Buffer.alloc(stat.size + 1);
              const length = readSync(fd, buffer, 0, buffer.length, 0);
              const after = fstatSync(fd);
              if (length !== stat.size || after.size !== stat.size || after.mtimeMs !== opened.mtimeMs || after.ctimeMs !== opened.ctimeMs || realpathSync(path) !== path) return null;
              const lines = buffer.subarray(0, length).toString('utf8').split(/\r?\n/).map(line => line.length);
              codeBounds.set(file, lines);
              return lines;
            } catch { return null; }
            finally { if (fd !== undefined) closeSync(fd); }
          };
          const failureFrames = messages => {
            const frames = [];
            let unknown = !Array.isArray(messages) || messages.length === 0;
            let truncated = Array.isArray(messages) && messages.length > 2;
            for (const [index, message] of (Array.isArray(messages) ? messages.slice(0, 2) : []).entries()) {
              if (typeof message !== 'string') { unknown = true; continue; }
              const bytes = Buffer.from(message);
              const cut = bytes.length > 16 * 1024;
              if (cut) truncated = true;
              const lines = bytes.subarray(0, 16 * 1024).toString('utf8').split('\n');
              if (cut || lines.at(-1) === '') lines.pop(); // Never inspect a partial final line.
              if (lines.length > 64) truncated = true;
              for (const raw of lines.slice(0, 64)) {
                const line = raw.replace(/\r$/, '');
                if (Buffer.byteLength(line) > 2 * 1024) { truncated = true; continue; }
                const clean = line.replace(/\u001b\[[0-?]*[ -/]*[@-~]/g, '');
                const frame = /^\s*at (?:[^()\r\n]+ \(([^()\r\n]+)\)|([^()\r\n]+))$/.exec(clean);
                const site = /^(.+):(-?\d+):(-?\d+)$/.exec(frame?.[1] ?? frame?.[2] ?? '');
                if (!site) continue;
                let path = site[1];
                if (path.startsWith('file:')) {
                  try {
                    const url = new URL(path);
                    if (url.protocol !== 'file:' || url.search || url.hash || url.href !== path) continue;
                    path = fileURLToPath(url);
                  } catch { continue; }
                }
                const file = publicFiles.find(file => path === file || path === join(workspace, file));
                if (!file) continue;
                const limits = bounds(file);
                const row = number(Number(site[2]), 1, limits?.length ?? 0);
                const column = row === null ? null : number(Number(site[3]), 1, limits[row - 1] + 1);
                if (row === null || column === null) { unknown = true; continue; }
                if (frames.length === 4) { truncated = true; continue; }
                frames.push({ file, line: row, column, message: index + 1 });
              }
            }
            return { status: unknown ? 'unknown' : frames.length ? 'matched' : truncated ? 'unknown' : 'no-match', truncated, frames };
          };
          const testResults = Array.isArray(vitest?.testResults) ? vitest.testResults : [];
          const cases = RELEASE_CASES.map(({ file, title }) => {
            const matches = testResults.filter(test => test?.name === join(env.GITHUB_WORKSPACE, file)).flatMap(test => Array.isArray(test.assertionResults) ? test.assertionResults.filter(assertion => assertion?.fullName === title) : []);
            const state = matches.length > 1 ? 'ambiguous' : choice(matches[0]?.status, ['passed', 'failed', 'pending', 'skipped', 'todo', 'disabled']);
            return { file, title, status: state, ...(state === 'failed' ? { failureFrames: failureFrames(matches[0].failureMessages) } : {}) };
          });
          const commands = Array.isArray(producer?.commands) ? producer.commands : [];
          const releaseCommands = Array.isArray(release?.commands) ? release.commands : [];
          // Only these reviewed credential-free CI test outputs may cross the raw-log boundary.
          // The JSON projection above still accepts no original bytes or free-form strings.
          const logs = { status: 'unavailable', files: [], bytes: 0 };
          const same = (a, b) => ['dev', 'ino', 'mode', 'uid', 'gid', 'nlink', 'size', 'mtimeMs', 'ctimeMs'].every(key => a[key] === b[key]);
          const readLog = (parts, room) => {
            let fd;
            let observedFile = false;
            const parents = [];
            try {
              let path = root;
              for (const part of ['', ...parts.slice(0, -1)]) {
                if (part) path = join(path, part);
                const stat = lstatSync(path);
                parents.push({ path, stat });
                if (!stat.isDirectory() || stat.isSymbolicLink() || realpathSync(path) !== path) throw 'unsafe';
              }
              path = join(root, ...parts);
              const stat = lstatSync(path);
              observedFile = true;
              if (!stat.isFile() || stat.isSymbolicLink() || stat.nlink !== 1 || realpathSync(path) !== path) throw 'unsafe';
              if (stat.size > room) throw 'oversized';
              fd = openSync(path, constants.O_RDONLY | constants.O_NOFOLLOW | constants.O_NONBLOCK);
              if (!same(stat, fstatSync(fd))) throw 'changed';
              const buffer = Buffer.alloc(stat.size + 1);
              const length = readSync(fd, buffer, 0, buffer.length, 0);
              if (length !== stat.size || !same(stat, fstatSync(fd)) || !same(stat, lstatSync(path)) || realpathSync(path) !== path || parents.some(parent => !same(parent.stat, lstatSync(parent.path)) || realpathSync(parent.path) !== parent.path)) throw 'changed';
              return buffer.subarray(0, length);
            } catch (error) {
              if (error?.code === 'ENOENT') {
                if (!observedFile) {
                  try { if (parents.every(parent => same(parent.stat, lstatSync(parent.path)) && realpathSync(parent.path) === parent.path)) return null; }
                  catch { /* An observed parent disappeared, so this is changed input. */ }
                }
                throw 'changed';
              }
              throw ['unsafe', 'oversized', 'changed'].includes(error) ? error : 'unsafe';
            } finally { if (fd !== undefined) closeSync(fd); }
          };
          let staged;
          let stagedIdentity;
          try {
            const contents = [];
            for (const [stage, directory] of [['producer', 'producer'], ['release', releaseDirectory]]) {
              let commandBytes = 0;
              for (const stream of ['stdout', 'stderr']) {
                const entry = { name: `${stage}.${stream}.txt`, status: directory ? 'missing' : 'unavailable' };
                logs.files.push(entry);
                if (!directory) continue;
                try {
                  const bytes = readLog([directory, 'tests', `${stream}.txt`], 32 * 1024 * 1024 - commandBytes);
                  if (bytes === null) continue;
                  entry.status = 'read';
                  commandBytes += bytes.length;
                  logs.bytes += bytes.length;
                  if (logs.bytes > 64 * 1024 * 1024) throw 'oversized';
                  contents.push({ name: entry.name, bytes });
                } catch (error) { entry.status = error; throw error; }
              }
            }
            if (contents.length) {
              staged = mkdtempSync(join(temporary, 'release-qualification-logs-'));
              stagedIdentity = lstatSync(staged);
              const files = contents.map(({ name, bytes }) => {
                writeFileSync(join(staged, name), bytes, { flag: 'wx', mode: 0o600 });
                return { name, bytes: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex') };
              });
              const manifest = { observationOnly: true, qualified: false, promotionEligible: false, source: /^[a-f0-9]{40}$/.test(env.REVIEWED_SOURCE_SHA ?? '') ? env.REVIEWED_SOURCE_SHA : null, runId: number(Number(env.GITHUB_RUN_ID), 1), runAttempt: number(Number(env.GITHUB_RUN_ATTEMPT), 1), files };
              writeFileSync(join(staged, 'manifest.json'), JSON.stringify(manifest, null, 2) + '\n', { flag: 'wx', mode: 0o600 });
              appendFileSync(env.GITHUB_OUTPUT, `logs_directory=${staged}\n`);
              logs.status = 'staged';
            }
          } catch {
            logs.status = 'refused';
            if (staged) {
              logs.cleanupConfirmed = false;
              try {
                if (realpathSync(staged) === staged && lstatSync(staged).dev === stagedIdentity.dev && lstatSync(staged).ino === stagedIdentity.ino) {
                  rmSync(staged, { recursive: true });
                  logs.cleanupConfirmed = true;
                }
              } catch { /* Keep the safe projection even if private staging cleanup is uncertain. */ }
            }
          }
          const diagnostic = {
            observationOnly: true, qualified: false, promotionEligible: false,
            qualificationOutcome: choice(env.QUALIFICATION_OUTCOME, ['failure', 'cancelled']),
            source: /^[a-f0-9]{40}$/.test(env.REVIEWED_SOURCE_SHA ?? '') ? env.REVIEWED_SOURCE_SHA : null,
            runId: number(Number(env.GITHUB_RUN_ID), 1), runAttempt: number(Number(env.GITHUB_RUN_ATTEMPT), 1), inputs,
            overall: { status: status(overall?.status) },
            producer: { status: status(producer?.status), fullSuccess: boolean(producer?.fullSuccess), commands: ['format', 'lint', 'types', 'build', 'tests', 'inventory'].map(stage => ({ stage, ...command(commands.filter(value => value?.stage === stage).length === 1 ? commands.find(value => value?.stage === stage) : null) })) },
            pack: command(overall?.pack),
            release: { status: status(release?.status), command: command(releaseCommands.length === 1 ? releaseCommands[0] : null), cleanup: cleanup(release?.release?.temporary), counts: { total: number(vitest?.numTotalTests), passed: number(vitest?.numPassedTests), failed: number(vitest?.numFailedTests) }, cases },
            consumer: { status: status(consumer?.status), command: command(consumerDirectory ? consumerAttempt?.command : null), cleanup: cleanup(consumer?.cleanup) },
            logs,
          };
          const bytes = JSON.stringify(diagnostic, null, 2) + '\n';
          if (Buffer.byteLength(bytes) > 64 * 1024) throw new Error('Diagnostic projection exceeds its bound.');
          const output = join(mkdtempSync(join(temporary, 'release-qualification-diagnostics-')), 'diagnostics.json');
          writeFileSync(output, bytes, { flag: 'wx', mode: 0o600 });
          appendFileSync(env.GITHUB_OUTPUT, `file=${output}\n`);
          JS
      - name: Upload failed qualification diagnostics
        if: ${{ always() && inputs.qualification_only && steps.diagnostics.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-qualification-diagnostics-${{ github.run_attempt }}
          path: ${{ steps.diagnostics.outputs.file }}
          if-no-files-found: error
          retention-days: 1
      - name: Scan failed qualification logs
        id: failure_log_scan
        if: ${{ always() && inputs.qualification_only && steps.diagnostics.outcome == 'success' && steps.diagnostics.outputs.logs_directory != '' }}
        env:
          LOGS_DIRECTORY: ${{ steps.diagnostics.outputs.logs_directory }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, constants, closeSync, fstatSync, lstatSync, mkdirSync, mkdtempSync, openSync, readFileSync, readdirSync, readSync, realpathSync, writeFileSync } from 'node:fs';
          import { createHash, randomUUID } from 'node:crypto';
          import { basename, dirname, join, resolve } from 'node:path';
          import { executeCommand } from './scripts/checks.mjs';
          const env = process.env;
          const temporary = realpathSync(env.RUNNER_TEMP);
          const privateRoot = mkdtempSync(join(temporary, 'release-log-scan-'));
          const receiptPath = join(privateRoot, 'result.json');
          const receipt = { observationOnly: true, qualified: false, promotionEligible: false, status: 'running', commands: [], cleanupConfirmed: false };
          const cancellation = new AbortController();
          const cancel = () => cancellation.abort();
          process.on('SIGINT', cancel);
          process.on('SIGTERM', cancel);
          const custody = randomUUID();
          const name = `ai-delivery-failure-logs-${env.GITHUB_RUN_ID}-${env.GITHUB_RUN_ATTEMPT}-${custody}`;
          const imageReference = 'ghcr.io/trufflesecurity/trufflehog:3.97.5';
          const directory = resolve(env.LOGS_DIRECTORY);
          let imageId;
          let containerId;
          let passed = false;
          const persist = () => writeFileSync(receiptPath, JSON.stringify(receipt, null, 2) + '\n', { mode: 0o600 });
          const call = async (args, cleanup = false, required = true) => {
            const record = await executeCommand(['docker', ...args], {
              cwd: env.GITHUB_WORKSPACE,
              env: { PATH: env.PATH, DOCKER_CONFIG: join(privateRoot, 'docker'), LANG: 'C' },
              directory: join(privateRoot, `command-${receipt.commands.length}`),
              signal: cleanup ? undefined : cancellation.signal,
              timeoutMs: ['start', 'pull'].includes(args[0]) ? 0 : 30_000,
              maxOutputBytes: 32 * 1024 * 1024, maxRssBytes: 3 * 1024 ** 3,
            });
            receipt.commands.push(record);
            persist();
            if (record.cleanupConfirmed !== true || (required && record.status !== 'passed')) throw new Error('Docker command refused.');
            return record;
          };
          const text = record => {
            if (lstatSync(record.stdoutPath).size > 1024 * 1024) throw new Error('Docker metadata exceeds its bound.');
            return readFileSync(record.stdoutPath, 'utf8').trim();
          };
          const inspect = async (selector, cleanup = false) => {
            const record = await call(['container', 'inspect', '--format', '{{json .}}', selector], cleanup, false);
            return record.status === 'passed' ? JSON.parse(text(record)) : null;
          };
