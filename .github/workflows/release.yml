            ${{ steps.diagnostics.outputs.logs_directory }}/manifest.json
            ${{ steps.diagnostics.outputs.logs_directory }}/producer.stdout.txt
            ${{ steps.diagnostics.outputs.logs_directory }}/producer.stderr.txt
            ${{ steps.diagnostics.outputs.logs_directory }}/release.stdout.txt
            ${{ steps.diagnostics.outputs.logs_directory }}/release.stderr.txt
          if-no-files-found: error
          retention-days: 1
      - name: Scan source history
        if: ${{ inputs.qualification_only }}
        uses: trufflesecurity/trufflehog@f714bf454f350590f4a24c3ddb1aef02c35bf5b6 # v3.97.5
